Name: waypipe
Summary: Network transparency with Wayland
# Note: 0.9.x is C, 0.10.x is rust!
# and 0.9.2 has a bug, so use the version from branch backport-v0.9.2
# also, update DescriptionMD version below in the chum meta section
Version: 0.10.2
Release: 0
Group: Applications
License: GPLv3
URL: https://gitlab.freedesktop.org/mstoeckl/waypipe/
SCM: https://gitlab.freedesktop.org/mstoeckl/waypipe/
Sources:
    - '%{name}-%{version}.tar.bz2'
#Patches:
#  - 'baz'
Description: |
    waypipe is a proxy for Wayland clients.

    It forwards Wayland messages and serializes changes to shared
    memory buffers over a single socket. This makes application
    forwarding similar to ssh -X feasible.

    %if "%{?vendor}" == "chum"
    Title: Waypipe
    Type: console-application
    DeveloperName: M. Stoeckl
    PackagedBy: nephros
    Categories:
     - Utility
    Custom:
      Repo: %{url}
      PackagingRepo: https://github.com/sailfishos-chum/waypipe
      DescriptionMD: https://gitlab.freedesktop.org/mstoeckl/waypipe/-/raw/v0.9.2/README.md
    PackageIcon: https://gitlab.freedesktop.org/uploads/-/system/project/avatar/3237/waypipe.png?width=128
    Links:
      Homepage: https://mstoeckl.com/notes/gsoc/blog.html
      Help: https://forum.sailfishos.org/t/fun-with-remote-wayland-waypipe/16997
    %endif

SetupOptions: -q -n %{name}-%{version}/upstream
RpmLintIgnore:
  - 'summary-too-long'
  - 'no-changelogname-tag'
  - 'invalid-url'
Macros:
  - '__meson_auto_features;disabled'
  - |
    spectacle_bug; hack_fix
    %if 0%{?_chum}
    BuildRequires: lz4-devel
    %endif
    %if 0%{?sailfishos_version} >= 40400
    BuildRequires: pkgconfig(libzstd)
    %define zstd_build enabled
    %else
    %define zstd_build disabled
    %endif
PkgBR:
   - sailfish-version > 3.2.1
   # gcc
   - cmake
   - meson
   - ninja
   # ffmpeg-devel >= 3.1
   # lz4-devel # < only in Chum
PkgConfigBR:
   - wayland-client
   - libavcodec
   - libavutil
   - libswscale
   # gbm     # <== DoD package
   # libdrm
   # zlib
   # libzstd # <-- only in 4.4+
Configure: none
Builder: none
NoFiles: true
SubPackages:
#    - Name:  rs
#      License: MIT
#      Group: Applications
#      AutoDepend: false
#      Provides:
#         - waypipe-bin
#      Files:
#        - '%license LICENSE.GPLv3'
#        - '%{_bindir}/waypipe'
    - Name:  c
      Summary: Network transparency with Wayland
      License: MIT
      Group: Applications
      AutoDepend: false
      Requires:
         - sailfish-version > 3.2.1
      Obsoletes:
         - waypipe <= 0.9.2
         - waypipe >= 0.8.6
      Provides:
         - waypipe-bin
      Files:
        - '%license LICENSE.MIT'
        - '%{_bindir}/waypipe-c'
